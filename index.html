<!DOCTYPE html>
<html lang="zh-TW"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">

<title>英文環境搭建手冊｜Ray</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;700&family=Noto+Sans+TC:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap');

  :root {
    --gold: #C9A84C;
    --gold-light: #E8D5A3;
    --gold-pale: #F5EDD6;
    --navy: #1A2744;
    --navy-mid: #2A3D6E;
    --ink: #2C2416;
    --ink-light: #5C4A2A;
    --cream: #FAF6EE;
    --cream-dark: #F0E8D8;
    --white: #FFFDF8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--cream);
    color: var(--ink);
    line-height: 1.8;
  }

  /* 密碼鎖畫面樣式 (VIP 尊榮高質感深藍設計) */
  #gatekeeper-container {
    background: var(--navy);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 9999;
    overflow: hidden;
  }
  #gatekeeper-container::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%; width: 200%; height: 200%;
    background: radial-gradient(ellipse at 30% 40%, rgba(201,168,76,0.1) 0%, transparent 60%);
    pointer-events: none;
  }
  .lock-box {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(201,168,76,0.3);
    padding: 40px 30px;
    border-radius: 4px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    position: relative;
    z-index: 2;
  }
  .lock-icon {
    font-size: 32px;
    color: var(--gold);
    margin-bottom: 20px;
  }
  .lock-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 20px;
    color: var(--white);
    margin-bottom: 10px;
    letter-spacing: 2px;
  }
  .lock-subtitle {
    font-size: 13px;
    color: var(--gold-light);
    margin-bottom: 30px;
    opacity: 0.8;
  }
  .password-input {
    width: 100%;
    padding: 12px 16px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(201,168,76,0.4);
    color: var(--white);
    font-size: 16px;
    text-align: center;
    letter-spacing: 4px;
    margin-bottom: 16px;
    border-radius: 2px;
    outline: none;
    transition: all 0.3s;
  }
  .password-input:focus {
    border-color: var(--gold-light);
    background: rgba(255,255,255,0.1);
  }
  .unlock-btn {
    width: 100%;
    padding: 12px;
    background: var(--gold);
    color: var(--navy);
    border: none;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    border-radius: 2px;
    transition: background 0.3s;
  }
  .unlock-btn:hover {
    background: var(--gold-light);
  }
  .error-msg {
    color: #ff6b6b;
    font-size: 13px;
    margin-top: 12px;
    display: none;
  }

  /* 完整內容主體（預設隱藏，解密成功才顯示） */
  #protected-content {
    display: none;
  }

  /* COVER */
  .cover {
    background: var(--navy);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 40px;
    position: relative;
    overflow: hidden;
  }

  .cover::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at 30% 40%, rgba(201,168,76,0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 60%, rgba(42,61,110,0.8) 0%, transparent 50%);
    pointer-events: none;
  }

  .cover-ornament {
    width: 120px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin-bottom: 40px;
  }

  .cover-brand {
    font-family: 'Noto Serif TC', serif;
    font-size: 14px;
    letter-spacing: 6px;
    color: var(--gold);
    margin-bottom: 20px;
    text-transform: uppercase;
  }

  .cover-title {
    font-family: 'Noto Serif TC', serif;
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 700;
    color: var(--white);
    text-align: center;
    line-height: 1.4;
    margin-bottom: 16px;
    letter-spacing: 2px;
  }

  .cover-subtitle {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: clamp(14px, 2vw, 18px);
    color: var(--gold-light);
    text-align: center;
    margin-bottom: 40px;
    letter-spacing: 1px;
  }

  .cover-ornament-bottom {
    width: 80px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin-bottom: 40px;
  }

  .cover-meta {
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 3px;
    text-align: center;
  }

  .cover-star {
    position: absolute;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0.15;
    animation: twinkle 3s infinite alternate;
  }

  @keyframes twinkle {
    from { opacity: 0.05; transform: scale(0.8); }
    to { opacity: 0.25; transform: scale(1.2); }
  }

  /* CONTENT */
  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 60px 40px;
  }

  /* FOREWORD */
  .foreword {
    background: var(--navy);
    color: var(--white);
    padding: 60px 40px;
  }

  .foreword-inner {
    max-width: 800px;
    margin: 0 auto;
  }

  .section-label {
    font-size: 11px;
    letter-spacing: 5px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--gold), transparent);
    opacity: 0.4;
  }

  .foreword h2 {
    font-family: 'Noto Serif TC', serif;
    font-size: clamp(22px, 3vw, 32px);
    font-weight: 500;
    color: var(--white);
    margin-bottom: 24px;
    line-height: 1.5;
  }

  .foreword p {
    color: rgba(255,255,255,0.75);
    font-size: 15px;
    line-height: 2;
    margin-bottom: 16px;
  }

  .foreword-result {
    margin-top: 32px;
    padding: 24px 28px;
    border-left: 3px solid var(--gold);
    background: rgba(201,168,76,0.08);
  }

  .foreword-result p {
    color: var(--gold-light);
    font-size: 14px;
    margin: 0;
    line-height: 1.9;
  }

  /* TIMELINE SECTION */
  .timeline-section {
    padding: 80px 0;
  }

  .page-section-label {
    font-size: 11px;
    letter-spacing: 5px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .section-title {
    font-family: 'Noto Serif TC', serif;
    font-size: clamp(22px, 3vw, 30px);
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 8px;
  }

  .section-desc {
    color: var(--ink-light);
    font-size: 14px;
    margin-bottom: 48px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--cream-dark);
  }

  /* PHASE CARDS */
  .phase {
    display: grid;
    grid-template-columns: 100px 1fr;
    gap: 0 32px;
    margin-bottom: 48px;
    position: relative;
  }

  .phase::before {
    content: '';
    position: absolute;
    left: 49px;
    top: 60px;
    bottom: -48px;
    width: 2px;
    background: linear-gradient(180deg, var(--gold-light), transparent);
  }

  .phase:last-child::before { display: none; }

  .phase-age {
    text-align: center;
    padding-top: 4px;
  }

  .phase-age-bubble {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--navy);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 8px;
    position: relative;
    z-index: 1;
  }

  .phase-age-bubble span {
    font-family: 'Noto Serif TC', serif;
    font-size: 11px;
    color: var(--gold);
    font-weight: 700;
    text-align: center;
    line-height: 1.2;
  }

  .phase-age-label {
    font-size: 10px;
    color: var(--ink-light);
    letter-spacing: 1px;
  }

  .phase-content {
    background: var(--white);
    border: 1px solid var(--cream-dark);
    border-radius: 2px;
    padding: 28px 32px;
    position: relative;
  }

  .phase-content::before {
    content: '';
    position: absolute;
    left: -8px;
    top: 20px;
    width: 14px;
    height: 14px;
    background: var(--white);
    border-left: 1px solid var(--cream-dark);
    border-bottom: 1px solid var(--cream-dark);
    transform: rotate(45deg);
  }

  .phase-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 6px;
  }

  .phase-milestone {
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .phase-items {
    list-style: none;
    margin-bottom: 16px;
  }

  .phase-items li {
    font-size: 14px;
    color: var(--ink);
    padding: 6px 0 6px 20px;
    position: relative;
    border-bottom: 1px solid var(--cream-dark);
    line-height: 1.7;
  }

  .phase-items li:last-child { border-bottom: none; }

  .phase-items li::before {
    content: '✦';
    position: absolute;
    left: 0;
    color: var(--gold);
    font-size: 8px;
    top: 10px;
  }

  .phase-tip {
    margin-top: 16px;
    padding: 14px 18px;
    background: var(--gold-pale);
    border-left: 2px solid var(--gold);
    font-size: 13px;
    color: var(--ink-light);
    line-height: 1.7;
  }

  .phase-tip strong {
    color: var(--ink);
    font-weight: 500;
  }

  /* PRINCIPLES */
  .principles-section {
    background: var(--navy);
    padding: 80px 40px;
  }

  .principles-inner {
    max-width: 800px;
    margin: 0 auto;
  }

  .principle-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 24px;
    margin-top: 40px;
  }

  .principle-card {
    padding: 28px 24px;
    border: 1px solid rgba(201,168,76,0.2);
    position: relative;
  }

  .principle-number {
    font-family: 'Playfair Display', serif;
    font-size: 48px;
    color: rgba(201,168,76,0.15);
    position: absolute;
    top: 12px;
    right: 16px;
    line-height: 1;
  }

  .principle-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--gold-light);
    margin-bottom: 10px;
    position: relative;
    z-index: 1;
  }

  .principle-desc {
    font-size: 13px;
    color: rgba(255,255,255,0.6);
    line-height: 1.8;
  }

  /* RESOURCES */
  .resources-section {
    padding: 80px 0;
  }

  .resource-category {
    margin-bottom: 40px;
  }

  .resource-category-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--navy);
    padding-bottom: 10px;
    border-bottom: 2px solid var(--navy);
    margin-bottom: 20px;
    display: flex;

    gap:
